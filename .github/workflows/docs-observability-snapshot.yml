name: Observability snapshot

on:
  workflow_dispatch: {}

concurrency:
  group: docs-observability-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Capture snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: ./.github/actions/bootstrap
        with:
          python-version: '3.13'

      - name: Install bernstein
        run: |
          uv sync --group dev

      - name: Capture observe snapshot
        id: capture
        continue-on-error: true  # `doctor observe` may return 1 on a backend WARN; snapshot still valid.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p docs/_internal/observability/snapshots
          DATE=$(date -u +%Y-%m-%d)
          uv run bernstein doctor observe --json --no-persist \
            > "docs/_internal/observability/snapshots/${DATE}.json"
          echo "snapshot=docs/_internal/observability/snapshots/${DATE}.json" >> "$GITHUB_OUTPUT"

      - name: Render 30-day trends
        run: |
          mkdir -p .ci/observability
          uv run python scripts/observability/render_trends.py \
            --snapshots-dir docs/_internal/observability/snapshots \
            --out .ci/observability/trends.md \
            --days 30

      - name: Detect metric regressions
        # Non-blocking. The gate diffs the new snapshot against the previous
        # one and records any regression (a metric that crossed its fail
        # threshold, a new or increased security finding, or a backend that
        # lost its credentials) in the run summary.
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .ci/observability
          uv run python scripts/observability/gate.py \
            --snapshots docs/_internal/observability/snapshots \
            --out .ci/observability/regressions.json \
            --summary-out "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

          if [ ! -s .ci/observability/regressions.json ]; then
            echo "No regressions recorded."
          else
            echo "Regressions recorded in the run summary."
          fi

      - name: Upload snapshot, trends and regressions
        # The run keeps its output as a downloadable artifact. Nothing is
        # written back to the repository.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: observability-snapshot
          path: |
            docs/_internal/observability/snapshots/
            .ci/observability/
          if-no-files-found: warn
          retention-days: 90
